apiVersion: v1
kind: Pod
metadata:
  name: flyte-preflight-cli
  namespace: flyte-preflight
spec:
  restartPolicy: Never
  containers:
    - name: cli
      image: junyi-runtime:preflight-kind
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 250m
          memory: 512Mi

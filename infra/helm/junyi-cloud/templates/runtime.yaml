apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    iam.gke.io/gcp-service-account: {{ required "serviceAccount.googleEmail is required" .Values.serviceAccount.googleEmail | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.name }}
  namespace: {{ .Release.Namespace }}
data:
  ARTIFACT_BACKEND: gcs
  ARTIFACT_ROOT: {{ .Values.config.artifactRoot | quote }}
  GCS_BUCKET: {{ required "config.artifactBucket is required" .Values.config.artifactBucket | quote }}
  DATA_LAKE_BACKEND: gcs
  DATA_LAKE_BUCKET: {{ required "config.dataLakeBucket is required" .Values.config.dataLakeBucket | quote }}
  DATA_LAKE_PREFIX: {{ .Values.config.dataLakePrefix | quote }}
  DIMENSION_DATA_PREFIX: {{ .Values.config.dimensionPrefix | quote }}
  JUNYI_LOG_FORMAT: json
  JUNYI_LOG_LEVEL: INFO
{{ if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.database.secretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "database.url or database.existingSecret is required" .Values.database.url | quote }}
{{ end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: junyi-demo-limits
  namespace: {{ .Release.Namespace }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.cpu | quote }}
    requests.memory: {{ .Values.quota.memory | quote }}
    requests.ephemeral-storage: {{ .Values.quota.ephemeralStorage | quote }}
    pods: {{ .Values.quota.pods | quote }}

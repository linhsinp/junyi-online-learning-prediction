# Disposable local overlay for the pinned Flyte chart.  It is intentionally
# separate from values-demo.yaml: no GCP resource or credential is involved.
serviceAccount:
  create: true
  name: flyte-preflight-control

# The pinned chart's default ClusterRole does not include the namespace lookup
# performed by the v2 manager during startup. This permission belongs only to
# the local Flyte control plane, never to the Junyi task service account.
rbac:
  extraRules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get"]
    - apiGroups: ["events.k8s.io"]
      resources: ["events"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["delete"]

flyte-core-components:
  manager:
    kubernetes:
      namespace: flyte-preflight
  actions:
    kubernetes:
      namespace: flyte-preflight
  secret:
    kubernetes:
      namespace: flyte-preflight
  runs:
    storagePrefix: s3://flyte-data
    database:
      postgres:
        host: flyte-postgres-postgres.flyte-preflight.svc.cluster.local
        port: 5432
        dbname: flyte
        username: flyte
        password: flyte-preflight-local-only
        options: sslmode=disable

configuration:
  database:
    host: flyte-postgres-postgres.flyte-preflight.svc.cluster.local
    port: 5432
    dbname: flyte
    username: flyte
    password: flyte-preflight-local-only
    options: sslmode=disable
  storage:
    provider: s3
    metadataContainer: flyte-data
    userDataContainer: flyte-data
    providerConfig:
      s3:
        region: us-east-1
        disableSSL: true
        v2Signing: true
        # The CLI uploads bundles from the host while Flyte runs in kind.
        # The run target exposes MinIO briefly at this Docker Desktop hostname,
        # which is reachable from both sides of that boundary.
        endpoint: host.docker.internal:9000
        authType: accesskey
        accessKey: minio
        secretKey: flyte-preflight-local-only

deployment:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

service:
  type: ClusterIP

ingress:
  create: false

apiVersion: v1
kind: Service
metadata:
  name: {{ include "junyi-local-postgres.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 5432
      targetPort: postgres
      nodePort: {{ .Values.service.nodePort }}
  selector:
    app.kubernetes.io/name: {{ include "junyi-local-postgres.fullname" . }}
